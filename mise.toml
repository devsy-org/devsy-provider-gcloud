[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tool_config]
locked = true

[tools]
go = "1.26.10"
golangci-lint = "2.12.2"
goreleaser = "2.18.3"
prek = "0.5.6"

[tasks.setup]
description = "Install dependencies and git hooks"
depends = ["setup:dependencies", "setup:hooks"]

[tasks."setup:dependencies"]
description = "Download Go modules with retries"
run = '''
attempt=1
until go mod download; do
  if [ "$attempt" -ge 3 ]; then
    exit 1
  fi
  sleep "$((attempt * 5))"
  attempt="$((attempt + 1))"
done
'''

[tasks."setup:hooks"]
description = "Install prek git hooks"
run = "prek install"

[tasks."build:cli"]
description = "Build the cli"
run = "goreleaser release --snapshot --clean"

[tasks."build:provider"]
description = "Build the provider.yaml"
usage = 'arg "<version>" help="provider version"'
run = 'go run ./hack/provider/main.go "$usage_version" > ./dist/provider.yaml'

[tasks.release]
description = "Build binaries and generate provider.yaml with version from git tag"
run = '''
goreleaser release --snapshot --clean
VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")"
go run ./hack/provider/main.go "$VERSION" > ./dist/provider.yaml
'''

[tasks.publish]
description = "Build and publish release"
run = '''
goreleaser release --clean
VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")"
go run ./hack/provider/main.go "$VERSION" > ./dist/provider.yaml
'''
